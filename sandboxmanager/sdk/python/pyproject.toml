[project]
name = "sandbox-sdk"
version = "0.1.0"
description = "Python SDK for the SandboxManager API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running sandbox API (set SANDBOX_API_URL)"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
